# HomBot overview (manual Lovelace example)
#
# Replace every placeholder with the entity IDs from your installation.
# Unique IDs include the configured robot URL, so the IDs differ between installs.
#
# REQUIRED placeholders:
#   REPLACE_VACUUM_ENTITY        e.g. vacuum.hombot
#   REPLACE_CAMERA_ENTITY        e.g. camera.hombot_camera
#   REPLACE_BATTERY_ENTITY       e.g. sensor.hombot_battery
#   REPLACE_REPEAT_ENTITY        e.g. switch.hombot_repeat
#   REPLACE_PATTERN_ENTITY       e.g. select.hombot_cleaning_pattern
#   REPLACE_MAP_ENTITY           e.g. image.hombot_map
#   REPLACE_ROUTE_SELECT_ENTITY  e.g. select.hombot_cleaning_route
#   REPLACE_ROUTE_IMAGE_ENTITY   e.g. image.hombot_route
#
# This file is an example only. It does not install cards, modify dashboards,
# or talk to the robot. The camera panel shows still snapshots, not a
# guaranteed continuous live video stream.
#
# The learned map is the stored floor map. The route image is one historical
# cleaning and stays empty until a run is chosen below.
#
# Uses only built-in Lovelace cards (vertical-stack, markdown, picture-entity,
# horizontal-stack, button, entities). No custom frontend cards required.
# Actions use perform-action (Home Assistant 2024.8+).
# picture-entity accepts the camera entity and the image entities.

type: vertical-stack
cards:
  - type: markdown
    content: |
      ## HomBot
      **Status:** {{ states('REPLACE_VACUUM_ENTITY') }}
      **Battery:** {{ states('REPLACE_BATTERY_ENTITY') }}%{% if state_attr('REPLACE_BATTERY_ENTITY', 'charging') %} (charging){% endif %}

  - type: picture-entity
    entity: REPLACE_CAMERA_ENTITY
    camera_view: auto
    show_name: false
    show_state: false
    aspect_ratio: "4:3"

  - type: horizontal-stack
    cards:
      - type: button
        name: Start
        icon: mdi:play
        tap_action:
          action: perform-action
          perform_action: vacuum.start
          target:
            entity_id: REPLACE_VACUUM_ENTITY
      - type: button
        name: Pause
        icon: mdi:pause
        tap_action:
          action: perform-action
          perform_action: vacuum.pause
          target:
            entity_id: REPLACE_VACUUM_ENTITY
      - type: button
        name: Stop
        icon: mdi:stop
        tap_action:
          action: perform-action
          perform_action: vacuum.stop
          target:
            entity_id: REPLACE_VACUUM_ENTITY
      - type: button
        name: Dock
        icon: mdi:home-import-outline
        tap_action:
          action: perform-action
          perform_action: vacuum.return_to_base
          target:
            entity_id: REPLACE_VACUUM_ENTITY

  - type: horizontal-stack
    cards:
      - type: button
        name: Turbo on
        icon: mdi:fan-plus
        tap_action:
          action: perform-action
          perform_action: vacuum.set_fan_speed
          target:
            entity_id: REPLACE_VACUUM_ENTITY
          data:
            fan_speed: Turbo
      - type: button
        name: Turbo off
        icon: mdi:fan
        tap_action:
          action: perform-action
          perform_action: vacuum.set_fan_speed
          target:
            entity_id: REPLACE_VACUUM_ENTITY
          data:
            fan_speed: Normal

  - type: entities
    title: Repeat and cleaning pattern
    show_header_toggle: false
    entities:
      - entity: REPLACE_REPEAT_ENTITY
        name: Repeat
      - entity: REPLACE_PATTERN_ENTITY
        name: Cleaning pattern

  - type: markdown
    content: |
      ## Maps
      **Learned map** is the stored floor map. It does not depend on a cleaning run.
      **Route** is one past cleaning. Choose a run below before that image appears.

  - type: horizontal-stack
    cards:
      - type: vertical-stack
        cards:
          - type: picture-entity
            entity: REPLACE_MAP_ENTITY
            show_name: false
            show_state: false
          - type: markdown
            text_only: true
            content: Learned map
      - type: vertical-stack
        cards:
          - type: picture-entity
            entity: REPLACE_ROUTE_IMAGE_ENTITY
            show_name: false
            show_state: false
          - type: markdown
            text_only: true
            content: Historical route

  - type: entities
    title: Historical cleaning run
    show_header_toggle: false
    entities:
      - entity: REPLACE_ROUTE_SELECT_ENTITY
        name: Cleaning route

  - type: entities
    title: Status details
    show_header_toggle: false
    entities:
      - type: attribute
        entity: REPLACE_VACUUM_ENTITY
        attribute: fan_speed
        name: Fan speed
      - type: attribute
        entity: REPLACE_VACUUM_ENTITY
        attribute: cleaning_mode
        name: Cleaning mode
      - type: attribute
        entity: REPLACE_VACUUM_ENTITY
        attribute: repeat_mode
        name: Repeat
      - type: attribute
        entity: REPLACE_VACUUM_ENTITY
        attribute: last_clean
        name: Last cleaning
      - type: attribute
        entity: REPLACE_VACUUM_ENTITY
        attribute: nickname
        name: Nickname
      - type: attribute
        entity: REPLACE_VACUUM_ENTITY
        attribute: firmware_version
        name: Firmware
      - type: attribute
        entity: REPLACE_VACUUM_ENTITY
        attribute: total_cleanings
        name: Total cleanings
